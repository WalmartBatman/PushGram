buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
        // Uncomment below once you have a real google-services.json:
        // classpath 'com.google.gms:google-services:4.4.0'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Fixed: rootProject.buildDir is deprecated in Gradle 8 → use layout API instead
tasks.register('clean', Delete) {
    delete layout.buildDirectory
}
