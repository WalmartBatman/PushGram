# Builds and publishes PushGram to GitHub Packages on every release.

name: Gradle Package

on:
  release:
    types: [created]

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      # Same wrapper fix applied in build.yml — prevents 4.4.1 checksum error
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582
        with:
          gradle-version: '8.2'
          validate-wrappers: false
          cache-read-only: false

      - name: Regenerate Gradle wrapper JAR
        run: gradle wrapper --gradle-version 8.2

      - name: Write local.properties
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      # Decode base64 keystore secret → .jks file, then build signed release APK
      - name: Decode keystore
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > app/pushgram-release.jks
            echo "Keystore decoded from secret."
          elif [ -f "app/pushgram-release.jks" ]; then
            echo "Secret not set — using committed keystore (dev/test build)."
          else
            echo "ERROR: No keystore available. Set KEYSTORE_BASE64 secret or commit app/pushgram-release.jks."
            exit 1
          fi
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PATH: pushgram-release.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS:     ${{ secrets.KEY_ALIAS }}
          KEY_PASS:      ${{ secrets.KEY_PASS }}

      - name: Publish to GitHub Packages
        run: ./gradlew publish --no-daemon
        env:
          USERNAME: ${{ github.actor }}
          TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          KEYSTORE_PATH: pushgram-release.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS:     ${{ secrets.KEY_ALIAS }}
          KEY_PASS:      ${{ secrets.KEY_PASS }}
