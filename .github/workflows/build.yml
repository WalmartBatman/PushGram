name: Build PushGram APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Write local.properties
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
          echo "local.properties written:"
          cat local.properties

      - name: Verify Android SDK platforms
        run: |
          ls /usr/local/lib/android/sdk/platforms/ | tail -6

      - name: Build Debug APK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        if: always()
        run: find . -name "*.apk" 2>/dev/null || echo "No APK produced"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PushGram-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
