name: Build PushGram APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Write local.properties
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Debug wrapper
        run: |
          echo "=== CWD ===" && pwd
          echo "=== Jar exists ===" && ls -la gradle/wrapper/
          echo "=== Java ===" && java -version
          echo "=== Test jar directly ===" 
          java -classpath gradle/wrapper/gradle-wrapper.jar \
            org.gradle.wrapper.GradleWrapperMain --version || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PushGram-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
