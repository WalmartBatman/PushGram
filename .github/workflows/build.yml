name: Build PushGram APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-read-only: false
          validate-wrappers: false

      - name: Regenerate Gradle wrapper JAR
        run: gradle wrapper --gradle-version 8.2

      - name: Write local.properties
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties


      - name: Decode keystore
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Strip whitespace/newlines that corrupt base64 when pasted into GitHub Secrets
            printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 --decode > app/pushgram-release.jks
            echo "Keystore decoded from secret."
          elif [ -f "app/pushgram-release.jks" ]; then
            echo "Secret not set — using committed keystore (dev/test build)."
          else
            echo "ERROR: No keystore available. Set KEYSTORE_BASE64 secret or commit app/pushgram-release.jks."
            exit 1
          fi
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
        env:
          KEYSTORE_PATH: pushgram-release.jks
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS:     ${{ secrets.KEY_ALIAS }}
          KEY_PASS:      ${{ secrets.KEY_PASS }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PushGram-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
