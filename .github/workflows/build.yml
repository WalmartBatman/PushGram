name: Build PushGram APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Get Gradle wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          # services.gradle.org is fully accessible from GitHub Actions runners
          curl -fL \
            "https://services.gradle.org/distributions/gradle-8.2-bin.zip" \
            -o /tmp/gradle.zip
          unzip -o /tmp/gradle.zip -d /tmp/gradle-unzipped/
          # The wrapper jar is inside the lib directory of the distribution
          find /tmp/gradle-unzipped/ -name "gradle-wrapper-*.jar" \
            | head -1 | xargs -I{} cp {} gradle/wrapper/gradle-wrapper.jar
          echo "Wrapper JAR: $(wc -c < gradle/wrapper/gradle-wrapper.jar) bytes"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: gradle-

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PushGram-debug
          path: app/build/outputs/apk/debug/app-debug.apk
