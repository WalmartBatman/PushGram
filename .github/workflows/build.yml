name: Build PushGram APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-read-only: false
          validate-wrappers: false

      - name: Regenerate Gradle wrapper JAR
        run: gradle wrapper --gradle-version 8.2

      - name: Write local.properties
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties


      - name: Verify keystore
        run: |
          if [ -f "app/pushgram-release.jks" ]; then
            echo "Keystore found at app/pushgram-release.jks"
          else
            echo "ERROR: app/pushgram-release.jks not found in repo."
            exit 1
          fi


      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
          grep -A30 "FAILURE:\|WHAT WENT WRONG\|error:" build.log | head -60 || true --info 2>&1 | grep -E "error:|FAILED|Exception|Caused by|> Task" | head -40 || true
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
          grep -A30 "FAILURE:\|WHAT WENT WRONG\|error:" build.log | head -60 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PushGram-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
