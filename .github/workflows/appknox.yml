# Appknox Mobile Security Scan
# Docs: https://www.appknox.com/
# Requires: APPKNOX_ACCESS_TOKEN secret set in repo Settings → Secrets

name: Appknox Security Scan

permissions:
  contents: read          # needed by actions/checkout
  security-events: write  # needed by codeql-action/upload-sarif

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  appknox:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Fix #3: JDK 17 required for Gradle 8.2
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Fix #2: Apply same wrapper fix as build.yml (avoids 4.4.1 checksum error)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
          cache-read-only: false
          validate-wrappers: false

      - name: Regenerate Gradle wrapper JAR
        run: gradle wrapper --gradle-version 8.2

      - name: Write local.properties
        run: echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties

      # Fix #1 + #2: Build release APK (matches build.yml output path)
      - name: Build Release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Fix #1: APK path now points to release (was debug — file did not exist)
      - name: Appknox security scan
        uses: appknox/appknox-github-action@b7d2bfb2321d5544e97bffcba48557234ab953a4
        with:
          appknox_access_token: ${{ secrets.APPKNOX_ACCESS_TOKEN }}
          file_path: app/build/outputs/apk/release/app-release.apk
          risk_threshold: HIGH    # MEDIUM was too strict for active dev; HIGH catches real blockers
          sarif: Enable

      # Fix #4: Guard SARIF upload — only runs if GHAS is available (public repo or GHAS licence)
      - name: Upload SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report.sarif
        continue-on-error: true   # Won't break CI if GHAS not enabled on this repo
