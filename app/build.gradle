plugins {
    id 'com.android.application'
    // google-services plugin disabled: add it back once you have a real google-services.json
    // id 'com.google.gms.google-services'
}

android {
    namespace "com.pushgram.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.pushgram.app"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            // CI: decode KEYSTORE_BASE64 secret -> app/pushgram-release.jks, set env vars
            // Dev: committed app/pushgram-release.jks used directly with defaults
            def ksPath = System.getenv("KEYSTORE_PATH")
            def ksFile = ksPath ? new File(rootProject.projectDir, "app/" + ksPath)
                                : file("pushgram-release.jks")
            storeFile     ksFile.exists() ? ksFile : file("pushgram-release.jks")
            storePassword System.getenv("KEYSTORE_PASS") ?: "pushgram123"
            keyAlias      System.getenv("KEY_ALIAS")     ?: "pushgram"
            keyPassword   System.getenv("KEY_PASS")      ?: "pushgram123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packagingOptions {
        pickFirst 'META-INF/LICENSE.md'
        pickFirst 'META-INF/LICENSE-notice.md'
    }
}

// Kotlin 1.8+ merges stdlib-jdk7/jdk8 into stdlib.
// Force all variants to the same version to eliminate duplicate class errors.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    // AndroidX Core
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.preference:preference:1.2.1'

    // CameraX
    def camerax_version = "1.3.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ML Kit Pose Detection
    implementation 'com.google.mlkit:pose-detection:18.0.0-beta4'

    // Music
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'androidx.media:media:1.6.0'

    // Firebase (for global leaderboard + battles)
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-auth'
}
